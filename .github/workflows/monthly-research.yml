name: Monthly research review

# Files one issue a month with the research brief: which briefs are oldest,
# what they already cite, and how stale the market signals are. A person
# reads it and decides what to update.
#
# WHAT THIS DELIBERATELY DOES NOT DO
#
# An earlier version of this workflow ran an agent with web access to
# research and open the pull request itself. Two reviewers found the same
# flaw, and they were right:
#
#   - The tool allowlist was passed as `allowed_tools`, which that action
#     does not accept, so it was silently discarded. The agent would have run
#     with its default tool set, not the narrow one the workflow appeared to
#     grant.
#   - With `contents: write` and a repository token, an agent reading live,
#     untrusted web pages is a prompt-injection path to pushing the default
#     branch or exfiltrating a secret. "Open a PR, never push to main" lived
#     only in prompt text, which is not a control.
#
# So the agent step is gone rather than patched. Re-adding it needs, at
# minimum: the allowlist passed the way the action actually reads it and
# verified in a real run log, `contents: read` on the job that touches the
# network, no secret the agent can echo, and the diff reaching a human before
# anything is pushed. None of that can be checked from a sandbox, so it is
# not being shipped on the strength of a guess.
#
# The brief needs no model, no network and no secret, and it is most of the
# value: a review starts from "these six are 89 days old and already cite
# these 27 pages" instead of a blank page.

on:
  schedule:
    # 06:41 UTC on the 1st. Off the hour because runs bunched on :00 queue.
    - cron: "41 6 1 * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: monthly-research
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # No npm install: the brief uses only Node builtins, so there is nothing
      # to resolve and nothing new in the supply chain.
      - name: Build the research brief
        run: |
          set -euo pipefail
          node scripts/research/brief.mjs | tee research-brief.txt

      - uses: actions/upload-artifact@v4
        with:
          name: research-brief
          path: research-brief.txt
          retention-days: 90

      - name: File or update the monthly issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: "Monthly research review"
        run: |
          set -euo pipefail

          {
            echo "## Research brief"
            echo ""
            echo "What is oldest, what is covered, and what each brief already cites."
            echo "Nothing here was researched or written by a model: it is the"
            echo "repository's own content, dated."
            echo ""
            echo '```'
            cat research-brief.txt
            echo '```'
            echo ""
            echo "[Run log](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})"
            echo ""
            echo "---"
            echo "_Generated by [Claude Code](https://claude.ai/code)_"
          } > issue.md

          existing=$(gh issue list --state open --search "$TITLE in:title" \
            --json number --jq '.[0].number // empty')

          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file issue.md
            echo "Updated issue #$existing"
          else
            gh issue create --title "$TITLE" --body-file issue.md
          fi
