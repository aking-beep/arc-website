name: Weekly site integrity

# The site points at nine independently deployed ARC Labs tools, a booking
# link and a set of cited research sources. None of them live in this
# repository, so any of them can go away without a single test failing.
#
# This runs weekly and files ONE issue, updating it rather than opening a new
# one each week, so a long-standing problem does not become a wall of
# duplicates nobody reads.

on:
  schedule:
    # Mondays at 07:17 UTC. Off the hour on purpose: scheduled runs bunched
    # on :00 get queued and delayed.
    - cron: "17 7 * * 1"
  workflow_dispatch:
    inputs:
      stale_days:
        description: "Days before dated content counts as stale"
        required: false
        default: "60"

permissions:
  contents: read
  issues: write

concurrency:
  group: weekly-integrity
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # No npm install: the checker uses only Node builtins, so there is
      # nothing to resolve and nothing new in the supply chain.
      - name: Check every external URL the site publishes
        id: check
        env:
          INTEGRITY_STALE_DAYS: ${{ github.event.inputs.stale_days || '60' }}
        run: |
          set +e
          node scripts/integrity/check.mjs | tee check.log
          echo "status=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATUS: ${{ steps.check.outputs.status }}
          TITLE: "Site integrity: something the site links to needs attention"
        run: |
          set -euo pipefail

          # 2 means the checker could not run (usually blocked egress). That is
          # a problem with the runner, not with the site, and filing a site
          # issue for it would be misleading. Fail the job loudly instead.
          if [ "$STATUS" = "2" ]; then
            echo "::error::The integrity check could not run. See the log above."
            exit 1
          fi

          existing=$(gh issue list --state open --search "$TITLE in:title" \
            --json number --jq '.[0].number // empty')

          if [ "$STATUS" = "0" ]; then
            echo "Everything resolves."
            if [ -n "$existing" ]; then
              printf '%s\n' \
                "Resolved: the weekly check now finds every linked URL reachable, and dated content is within the freshness threshold. Closing." \
                "" \
                "---" \
                "_Generated by [Claude Code](https://claude.ai/code)_" > resolved.md
              gh issue comment "$existing" --body-file resolved.md
              gh issue close "$existing"
            fi
            exit 0
          fi

          {
            cat integrity-report.md
            echo ""
            echo "[Run log](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})"
            echo ""
            echo "---"
            echo "_Generated by [Claude Code](https://claude.ai/code)_"
          } > issue.md

          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file issue.md
            echo "Updated issue #$existing"
          else
            gh issue create --title "$TITLE" --body-file issue.md
          fi
