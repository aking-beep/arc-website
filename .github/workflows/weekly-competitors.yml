name: Weekly competitor watch

# Snapshots the vendor pages listed in docs/competitors/watchlist.json and
# files an issue when one of them changes. A person reads the diff and decides
# whether the site needs updating.
#
# WHAT THIS DELIBERATELY DOES NOT DO
#
# No model reads these pages and no model decides what to do about them. This
# job fetches, strips tags, pulls the sentences containing a watched signal
# word, escapes them, and diffs against last week. That is the whole of it.
#
# The monthly research workflow reached the same conclusion the hard way: an
# agent that holds repository write while reading arbitrary web pages is a
# prompt-injection path, and a tool allowlist written in prompt text is not a
# control. Competitor marketing pages are exactly that kind of untrusted
# input, so this job holds `contents: read`, no secret beyond the default
# issue token, and no model at all.
#
# Widening the watch means editing the watchlist in a reviewed commit. The
# script fetches nothing that is not in that file.

on:
  schedule:
    # 07:23 UTC on Mondays. Off the hour because runs bunched on :00 queue.
    - cron: "23 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: weekly-competitors
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Rolling cache: each run writes a new key and restores the most recent
      # earlier one, which is how last week's snapshot reaches this week's run.
      # A cache miss is not an error — the run just establishes a new baseline
      # and says so in the issue.
      - name: Restore last week's snapshot
        uses: actions/cache@v4
        with:
          path: previous/
          key: competitor-snapshot-${{ github.run_id }}
          restore-keys: |
            competitor-snapshot-

      # No npm install: the watcher uses only Node builtins, so there is
      # nothing to resolve and nothing new in the supply chain.
      - name: Snapshot the watchlist and diff it
        id: watch
        run: |
          set -uo pipefail
          mkdir -p previous out

          prev_arg=""
          if [ -f previous/snapshot.json ]; then
            prev_arg="--prev previous/snapshot.json"
          fi

          set +e
          node scripts/competitors/watch.mjs \
            $prev_arg \
            --out out/snapshot.json \
            --report out/report.md \
            --summary out/summary.json
          code=$?
          set -e

          case "$code" in
            0) echo "All targets fetched and compared." ;;
            3) echo "::warning::Some targets were unreachable; the comparison is partial." ;;
            2)
              echo "::error::No target could be fetched. Treating this as blocked egress, not as 'nothing changed'."
              exit 1
              ;;
            *)
              echo "::error::Watcher failed with exit $code."
              exit 1
              ;;
          esac

          worth=$(node -e 'process.stdout.write(String(require("./out/summary.json").worthReporting))')
          echo "worth_reporting=$worth" >> "$GITHUB_OUTPUT"
          cat out/summary.json

          # Promote this run's snapshot so the cache save at job end carries it.
          cp out/snapshot.json previous/snapshot.json

      - uses: actions/upload-artifact@v4
        with:
          name: competitor-snapshot
          path: out/
          retention-days: 90

      - name: File or update the watch issue
        if: steps.watch.outputs.worth_reporting == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: "Weekly competitor watch"
        run: |
          set -euo pipefail

          {
            echo "## Competitor watch"
            echo ""
            cat out/report.md
            echo ""
            echo "[Run log](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})"
            echo ""
            echo "---"
            echo "_Generated by [Claude Code](https://claude.ai/code)_"
          } > issue.md

          existing=$(gh issue list --state open --search "$TITLE in:title" \
            --json number --jq '.[0].number // empty')

          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file issue.md
            echo "Updated issue #$existing"
          else
            gh issue create --title "$TITLE" --body-file issue.md
          fi
